<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEX Curat | Dicționarul Limbii Române Vii</title>
    <!-- Biblioteca Oficială Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f4f8; color: #1e293b; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 700px; width: 100%; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 40px 20px; box-sizing: border-box; margin-top: 20px; }
        .key-icon { font-size: 4rem; margin-bottom: 10px; text-align: center; }
        h1 { color: #1e3a8a; font-size: 3rem; margin: 0 0 10px 0; text-align: center; }
        .subtitle { color: #d97706; font-weight: bold; font-size: 1.1rem; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 18px 20px; font-size: 1.2rem; border: 3px solid #e2e8f0; border-radius: 12px; outline: none; }
        input:focus { border-color: #1e3a8a; }
        button { padding: 18px 30px; background: #1e3a8a; color: white; border: none; border-radius: 12px; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #1e40af; }
        .result-card { background: #f8fafc; border-left: 5px solid #1e3a8a; padding: 20px; border-radius: 8px; margin-bottom: 15px; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-card h3 { color: #1e3a8a; margin: 0 0 10px 0; font-size: 1.4rem; }
        .result-card p { color: #475569; margin: 0; line-height: 1.6; }
        .tag { display: inline-block; background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; margin-right: 5px; margin-top: 10px; font-weight: 600; }
        .no-result { background: #f1f5f9; padding: 30px; border-radius: 12px; text-align: center; color: #64748b; }
        .error-msg { background: #fee2e2; padding: 20px; border-radius: 12px; text-align: center; color: #991b1b; border: 1px solid #f87171; }
        .footer { margin-top: 40px; font-size: 0.9rem; color: #94a3b8; text-align: center; }
        .btn { display: inline-block; padding: 12px 25px; background: #1e3a8a; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 15px; }
        .links { margin-top: 20px; }
        .links a { color: #64748b; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="key-icon">️</div>
        <h1>DEX Curat</h1>
        <div class="subtitle">Dicționarul Limbii Române Vii & Muzeul Copilăriei</div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Scrie un cuvânt (ex: ABACĂ, NUC, APĂ)...">
            <button id="searchBtn">Caută</button>
        </div>

        <div id="resultsArea">
            <p style="color: #94a3b8; text-align: center;">Scrie un cuvânt și apasă butonul Caută.</p>
        </div>

        <div class="footer">
            <p>Ai o expresie de adăugat în dicționar?</p>
            <a href="mailto:contact@dex-curat.online" class="btn">Scrie-ne la contact@dex-curat.online</a>
            <div class="links">
                <a href="https://tiktok.com/@dexcurat" target="_blank">TikTok</a> • 
                <a href="https://instagram.com/dexcurat" target="_blank">Instagram</a> • 
                <a href="https://youtube.com/@dexcurat" target="_blank">YouTube</a>
            </div>
        </div>
    </div>

    <script>
        // Configurare Supabase
        const SUPABASE_URL = 'https://jfvdiwsdygvmsonivhpx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmdmRpd3NkeWd2bXNvbml2aHB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNzcxNDksImV4cCI6MjEwNzc1MzE0OX0.toJdOrqDayf46J1w0Bfzaf5KaxsNj8mQqksMscIhsFQ';

        // Inițializare client oficial Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsArea = document.getElementById('resultsArea');

        async function performSearch() {
            const query = searchInput.value.trim();
            
            if (query.length < 2) {
                resultsArea.innerHTML = '<p style="color: #94a3b8; text-align: center;">Scrie cel puțin 2 caractere.</p>';
                return;
            }

            resultsArea.innerHTML = '<p style="color: #1e3a8a; text-align: center; font-weight: bold;">🔍 Căutăm în dicționar...</p>';

            try {
                // Căutare folosind biblioteca oficială (mult mai sigură)
                const { data, error } = await supabase
                    .from('cuvinte')
                    .select('termen, definitie, taguri')
                    .ilike('termen', `%${query}%`)
                    .limit(10);

                if (error) {
                    throw error;
                }

                if (data.length === 0) {
                    resultsArea.innerHTML = `
                        <div class="no-result">
                            <p style="margin:0; font-size: 1.1rem;"><strong>Nu am găsit "${query}"</strong></p>
                            <p style="margin: 10px 0 0 0;">Încearcă să scrii cuvântul cu diacritice (ex: "apă" în loc de "apa").</p>
                        </div>
                    `;
                } else {
                    resultsArea.innerHTML = `<div style="margin-bottom: 15px; color: #64748b; font-size: 0.9rem;">✅ Am găsit <strong>${data.length}</strong> rezultate pentru "${query}"</div>` +
                        data.map(item => `
                            <div class="result-card">
                                <h3>${item.termen}</h3>
                                <p>${item.definitie}</p>
                                <div>${item.taguri ? item.taguri.split(',').map(tag => `<span class="tag">#${tag.trim()}</span>`).join('') : ''}</div>
                            </div>
                        `).join('');
                }
            } catch (error) {
                console.error('Eroare Supabase:', error);
                resultsArea.innerHTML = `
                    <div class="error-msg">
                        <p style="margin:0; font-size: 1.1rem;"><strong>A apărut o eroare de conexiune</strong></p>
                        <p style="margin: 10px 0 0 0; font-size: 0.9rem;">${error.message}</p>
                        <p style="margin: 10px 0 0 0; font-size: 0.8rem;">Dacă folosești Brave, dezactivează "Shields" pentru acest site.</p>
                    </div>
                `;
            }
        }

        // Atașăm evenimentele
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
