<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEX Curat | Dicționarul Limbii Române Vii</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: #1e293b; padding: 15px; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); padding: 30px 20px; }
        .header { text-align: center; margin-bottom: 25px; }
        .key-icon { font-size: 3.5rem; margin-bottom: 10px; }
        h1 { color: #1e3a8a; font-size: 2.5rem; margin-bottom: 5px; font-weight: 800; }
        .subtitle { color: #d97706; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .search-container { position: relative; margin-bottom: 25px; }
        #searchInput { width: 100%; padding: 18px 20px; font-size: 1.1rem; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: all 0.3s; }
        #searchInput:focus { border-color: #1e3a8a; box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1); }
        
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 100; max-height: 250px; overflow-y: auto; display: none; margin-top: 5px; }
        .autocomplete-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 1rem; }
        .autocomplete-item:hover { background: #eff6ff; color: #1e3a8a; font-weight: 600; }

        .museum-card { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border: 2px solid #f59e0b; padding: 25px; border-radius: 16px; margin-bottom: 25px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .museum-title { color: #92400e; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .museum-expression { color: #1e3a8a; font-size: 1.4rem; font-weight: 800; font-style: italic; margin-bottom: 10px; line-height: 1.3; }
        .museum-meaning { color: #4b5563; font-size: 1.05rem; line-height: 1.5; }

        /* CARDUL DE CORECCTIE PENTRU GREȘELI */
        .correction-card { background: #fef2f2; border-left: 5px solid #ef4444; padding: 20px; border-radius: 12px; margin-bottom: 20px; animation: slideIn 0.3s ease-out; }
        .correction-card h3 { color: #b91c1c; font-size: 1.2rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .correction-card .correct-word { color: #15803d; font-weight: 800; font-size: 1.3rem; }
        .correction-card p { color: #4b5563; line-height: 1.6; margin-top: 10px; }

        .results-info { margin-bottom: 15px; color: #64748b; font-size: 0.9rem; text-align: center; font-weight: 600; }
        .result-card { background: #f8fafc; border-left: 5px solid #1e3a8a; padding: 20px; border-radius: 12px; margin-bottom: 15px; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-card h3 { color: #1e3a8a; font-size: 1.4rem; margin-bottom: 10px; font-weight: 700; }
        .result-card p { color: #475569; line-height: 1.6; margin-bottom: 12px; font-size: 1.05rem; }
        .highlight-fig { color: #d97706; font-weight: 600; font-style: italic; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .tag.seo { background: #dcfce7; color: #166534; }
        
        .no-result { background: #f1f5f9; padding: 30px; border-radius: 12px; text-align: center; color: #64748b; }
        .loading { color: #1e3a8a; font-weight: 600; text-align: center; padding: 20px; }

        .game-btn { display: block; width: 100%; padding: 15px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 20px; transition: transform 0.2s; }
        .game-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
